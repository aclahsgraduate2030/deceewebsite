<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asriel Dreemurr</title>
    <style>
        @font-face {
            font-family: "Determination";
            src: url("htmlfont/determination.ttf");
        }

        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background: black;
            font-family: "Determination", sans-serif;
            color: white;
        }

        #cutscene_menu {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 48px;
        }

        .choice {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            font-size: 42px;
        }

        .soul {
            font-size: 42px;
            opacity: 0;
            transition: opacity 0.1s;
        }

        #wrapper {
            position: fixed;
            top: 50%;
            left: 50%;
            transform-origin: center;
            transform: translate(-50%, -50%) scale(2);
            display: none;
        }

        #togore_canvas {
            width: 1280px;
            height: 720px;
            display: block;
        }

        #scale_slider {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            display: none;
        }
    </style>
</head>
<body>

<div id="cutscene_menu">
    PRE-ASRIEL CUTSCENE or ASRIEL CUTSCENE?
    <div class="choice">
        <div class="soul" id="soul_pre">❤</div>
        <div id="pre_text">PRE-ASRIEL CUTSCENE</div>
    </div>
    <div class="choice">
        <div class="soul" id="soul_asriel">❤</div>
        <div id="asriel_text">ASRIEL CUTSCENE</div>
    </div>
</div>

<div id="loader" style="
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 36px;
    display: none;
">
    Loading... <span id="load_percent">0%</span>
</div>

<div id="wrapper">
    <canvas id="togore_canvas" width="1280" height="720"></canvas>
</div>

<input id="scale_slider" type="range" min="0.5" max="4" step="0.1" value="2">

<script>
let index = 0;
const gamescript = "asriel.js";

const musicFiles = [
    "music/mus_xpart.ogg",
    "music/mus_xpart_a.ogg",
    "music/mus_xpart_b.ogg",
    "music/mus_xpart_2.ogg",
    "music/mus_xpart_back.ogg",
    "music/mus_dontgiveup.ogg",
    "music/mus_bergentruckung.ogg",
    "music/mus_musicbox.ogg",
];

const AudioManager = {
    cache: {},
    load(src) {
        return new Promise(resolve => {
            const audio = new Audio();
            audio.src = src;
            audio.preload = "auto";
            audio.addEventListener("canplaythrough", () => {
                this.cache[src] = audio;
                resolve();
            }, { once: true });
            audio.load();
        });
    },
    play(src, loop = false, volume = 1) {
        if (!this.cache[src]) return;
        const sound = this.cache[src].cloneNode(true);
        sound.loop = loop;
        sound.volume = volume;
        sound.play();
        return sound;
    }
};

async function preloadAllAudio() {
    const loader = document.getElementById("loader");
    const loadPercent = document.getElementById("load_percent");
    loader.style.display = "block";

    for (let i = 0; i < musicFiles.length; i++) {
        await AudioManager.load(musicFiles[i]);
        const percent = Math.floor(((i + 1) / musicFiles.length) * 100);
        loadPercent.innerText = percent + "%";
    }

    loader.style.display = "none";
    document.getElementById("cutscene_menu").style.display = "block";
    updateSoul();
}

function updateSoul() {
    document.getElementById("soul_pre").style.opacity = index === 0 ? 1 : 0;
    document.getElementById("soul_asriel").style.opacity = index === 1 ? 1 : 0;
}

// Start loading on page load
window.onload = preloadAllAudio;

document.addEventListener("keydown", e => {
    const menu = document.getElementById("cutscene_menu");
    if (menu.style.display === "none") return;

    if (e.key === "ArrowUp") {
        index = (index - 1 + 2) % 2;
        updateSoul();
    }
    if (e.key === "ArrowDown") {
        index = (index + 1) % 2;
        updateSoul();
    }
    if (e.key === "Enter") {
        menu.style.display = "none";
        document.getElementById("wrapper").style.display = "block";
        document.getElementById("scale_slider").style.display = "block";

        const script = document.createElement("script");
        script.src = gamescript;
        document.body.appendChild(script);
    }
});

document.getElementById("scale_slider").addEventListener("input", e => {
    const scale = e.target.value;
    document.getElementById("wrapper").style.transform = `translate(-50%, -50%) scale(${scale})`;
});
</script>

</body>
</html>
